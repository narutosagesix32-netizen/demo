<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UST CICS - Interactive Digital Book</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,800;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --ust-gold: #d4af37;
            --ust-blue: #024a86;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            background-color: #0b1329;
            color: #f8fafc;
            font-family: 'Montserrat', sans-serif;
            user-select: none;
            overflow-x: hidden;
            overflow-y: auto;
        }

        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
        }

        .poster-container {
            width: 100vw;
            max-width: 100%;
            margin: 0 auto;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* HERO SECTION STRETCHED NO CUTOFF */
        .hero-section-stretch {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: flex-start; /* ALIGNS CONTENT TO THE LEFT SIDE */
            overflow: hidden;
            background-color: #0b1329;
        }

        .hero-stretch-img {
            position: absolute;
            inset: 0;
            width: 100vw;
            height: 100vh;
            object-fit: fill;
            pointer-events: none;
            z-index: 0;
        }

        .poster-slice {
            width: 100vw;
            height: auto;
            display: block;
            pointer-events: none;
        }

        /* --- 3D SPINNING SINGLE BOOK STAGE --- */
        .single-book-stage {
            perspective: 1200px;
            perspective-origin: 50% 50%;
        }

        .spinning-book-wrapper {
            width: 130px;
            height: 190px;
            position: relative;
            transform-style: preserve-3d;
            animation: floatAndSpin 7s ease-in-out infinite alternate;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        @media (min-width: 768px) {
            .spinning-book-wrapper {
                width: 160px;
                height: 235px;
            }
        }

        @media (min-width: 1280px) {
            .spinning-book-wrapper {
                width: 175px;
                height: 255px;
            }
        }

        .spinning-book-wrapper:hover {
            animation-play-state: paused;
            transform: scale(1.08) rotateY(-15deg) rotateX(10deg);
        }

        @keyframes floatAndSpin {
            0% {
                transform: translateY(0px) rotateY(-20deg) rotateX(6deg);
            }
            50% {
                transform: translateY(-15px) rotateY(20deg) rotateX(-4deg);
            }
            100% {
                transform: translateY(0px) rotateY(-20deg) rotateX(6deg);
            }
        }

        /* REALISTIC BOOK COVER WITH PAGE 1 PREVIEW */
        .cover-page-preview {
            width: 100%;
            height: 100%;
            border: 3px solid #d4af37;
            box-shadow: 0 15px 35px rgba(2, 74, 134, 0.6), 0 0 25px rgba(212, 175, 55, 0.4), inset 0 0 20px rgba(0, 0, 0, 0.5);
            position: relative;
            border-radius: 4px 12px 12px 4px;
            overflow: hidden;
            background-color: #ffffff;
        }

        .cover-page-preview img {
            width: 100%;
            height: 100%;
            object-fit: fill;
            pointer-events: none;
        }

        .book-glow-halo {
            filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.5));
        }

        /* --- 3D BOOK FLIP MODAL --- */
        .modal-scene {
            perspective: 2500px;
            perspective-origin: 50% 50%;
        }

        .book-3d-viewport {
            transform-style: preserve-3d;
            position: relative;
            width: min(1200px, 94vw);
            height: min(850px, 78vh);
        }

        .book-base-left, .book-base-right {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            background-color: #1a1a1a;
            border-radius: 10px 2px 2px 10px;
            z-index: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .book-base-left { left: 0; }
        .book-base-right { right: 0; border-radius: 2px 10px 10px 2px; }

        .book-page-3d {
            position: absolute;
            right: 0;
            top: 0;
            width: 50%;
            height: 100%;
            transform-style: preserve-3d;
            transform-origin: left center;
            transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1);
            border-radius: 2px 10px 10px 2px;
        }

        .page-face {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            padding: 0;
            overflow: hidden;
            border-radius: 2px 10px 10px 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.1);
        }

        .page-face-back {
            transform: rotateY(180deg);
            border-radius: 10px 2px 2px 10px;
        }

        .page-img {
            width: 100%;
            height: 100%;
            object-fit: fill;
            pointer-events: none;
        }

        .corner-fold {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 0 35px 35px;
            border-color: transparent transparent rgba(0,0,0,0.3) transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            z-index: 20;
        }
        .book-page-3d:hover .corner-fold {
            border-width: 0 0 50px 50px;
            border-color: transparent transparent #d4af37 transparent;
        }
    </style>
</head>
<body>

    <canvas id="particles-canvas"></canvas>

    <!-- Fixed Controls Header -->
    <header class="fixed top-4 right-6 z-30">
        <div class="flex items-center gap-3 bg-blue-950/85 border border-amber-400/60 px-5 py-2 rounded-full backdrop-blur-md text-sm text-amber-200 shadow-2xl">
            <button id="btn-sound-toggle" class="hover:text-amber-400 transition-colors flex items-center gap-2 px-2">
                <i id="sound-icon" class="fa-solid fa-volume-high text-amber-400"></i>
                <span class="text-xs font-mono font-bold">AUDIO</span>
            </button>
            <span class="text-amber-500/50">|</span>
            <div class="text-xs font-mono text-amber-200 flex items-center gap-1.5 font-bold">
                <i class="fa-solid fa-hand-pointer text-amber-400 animate-bounce"></i>
                <span>CLICK BOOK TO READ</span>
            </div>
        </div>
    </header>

    <!-- FULL POSTER BACKGROUND CONTAINER -->
    <div class="poster-container">
        
        <!-- SECTION 1: FULL STRETCHED HERO BACKGROUND -->
        <section class="hero-section-stretch">
            <img src="images/Background1.jpg" alt="Pastoral Projects Header" class="hero-stretch-img">

            <!-- OVERLAY FLOATING BOOK POSITIONED ON THE LEFT SIDE -->
            <div class="relative z-20 flex flex-col items-center ml-8 sm:ml-16 md:ml-28 lg:ml-36 pt-12 sm:pt-16 book-glow-halo">
                <div class="single-book-stage">
                    <div onclick="app.openBook()" class="spinning-book-wrapper group">
                        <div class="cover-page-preview group-hover:shadow-[0_0_45px_rgba(212,175,55,0.8)] transition-all duration-300">
                            <!-- PAGE 1 DISPLAYED DIRECTLY ON COVER -->
                            <img src="images/VIA LUCIS STATION/1.png" alt="Via Lucis Station Cover Page">
                        </div>
                    </div>
                </div>

                <!-- TITLE BADGE -->
                <div class="mt-3 text-center bg-blue-950/90 border border-amber-400/50 px-4 py-1.5 rounded-2xl backdrop-blur-md shadow-2xl">
                    <h3 class="text-xs sm:text-sm font-bold text-amber-200 tracking-wide">12 Project Committees</h3>
                    <p class="text-[10px] text-slate-300 font-medium">By Fr. Gaspar Sigaya O.P</p>
                </div>
            </div>
        </section>

        <!-- SECTION 2: COMMITTEES GRID -->
        <img src="images/Background2.jpg" alt="Project Committees Poster" class="poster-slice">

        <!-- SECTION 3: MOTTO BANNER -->
        <img src="images/Background3.jpg" alt="Motto Banner Poster" class="poster-slice">

        <!-- Footer Caption -->
        <footer class="w-full py-3 text-center text-xs text-amber-200/90 font-medium tracking-wide z-20 bg-slate-950/90 border-t border-amber-500/30">
            Interactive E-Book Archive • UST CICS
        </footer>

    </div>

    <!-- 3D BOOK FLIP MODAL -->
    <div id="book-modal" class="fixed inset-0 bg-black/95 backdrop-blur-md z-50 flex flex-col justify-between items-center p-3 sm:p-5 opacity-0 pointer-events-none transition-opacity duration-500 modal-scene">
        
        <!-- Modal Toolbar -->
        <div class="w-full max-w-6xl flex justify-between items-center z-50">
            <div class="flex items-center gap-3">
                <span id="active-book-badge" class="px-4 py-1.5 rounded-full text-xs font-bold font-mono border border-amber-400/50 bg-blue-950/80 text-amber-300 shadow-lg">
                    Via Lucis Station
                </span>
            </div>

            <button onclick="app.closeBook()" class="px-5 py-2 bg-rose-950/90 hover:bg-rose-900 border border-rose-400/50 rounded-full text-rose-200 text-xs font-bold font-mono transition-all flex items-center gap-2 shadow-xl hover:scale-105">
                <i class="fa-solid fa-xmark text-sm"></i>
                <span>CLOSE BOOK</span>
            </button>
        </div>

        <!-- 3D Viewport -->
        <div class="my-auto relative flex items-center justify-center w-full">
            <div id="book-3d-viewport" class="book-3d-viewport">
                <div class="book-base-left"></div>
                <div class="book-base-right"></div>
            </div>
        </div>

        <!-- Navigation Controls -->
        <div class="w-full max-w-md bg-blue-950/90 border border-amber-400/40 rounded-full px-6 py-2.5 flex justify-between items-center z-50 backdrop-blur-md shadow-2xl">
            <button id="btn-prev-page" onclick="app.prevPage()" class="p-2 text-amber-300 hover:text-amber-100 disabled:opacity-30 disabled:hover:text-amber-300 transition-colors">
                <i class="fa-solid fa-arrow-left text-lg"></i>
            </button>

            <span id="modal-page-indicator" class="text-xs font-mono text-amber-200 font-bold tracking-widest">
                PAGE 1 / 12
            </span>

            <button id="btn-next-page" onclick="app.nextPage()" class="p-2 text-amber-300 hover:text-amber-100 disabled:opacity-30 disabled:hover:text-amber-300 transition-colors">
                <i class="fa-solid fa-arrow-right text-lg"></i>
            </button>
        </div>

    </div>

    <script>
        const SINGLE_BOOK_DATA = {
            id: "via-lucis",
            title: "Via Lucis Station",
            leaves: [
                { front: "images/VIA LUCIS STATION/1.png", back: "images/VIA LUCIS STATION/2.png" },
                { front: "images/VIA LUCIS STATION/3.png", back: "images/VIA LUCIS STATION/4.png" },
                { front: "images/VIA LUCIS STATION/5.png", back: "images/VIA LUCIS STATION/6.png" },
                { front: "images/VIA LUCIS STATION/7.png", back: "images/VIA LUCIS STATION/8.png" },
                { front: "images/VIA LUCIS STATION/9.png", back: "images/VIA LUCIS STATION/10.png" },
                { front: "images/VIA LUCIS STATION/11.png", back: "images/VIA LUCIS STATION/12.png" }
            ]
        };

        class WebAudioFX {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
            }

            playPageFlip() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                const bufferSize = this.ctx.sampleRate * 0.3;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(900, now);
                filter.frequency.exponentialRampToValueAtTime(300, now + 0.28);
                filter.Q.value = 2;

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.01, now);
                gain.gain.linearRampToValueAtTime(0.3, now + 0.08);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);

                noise.start(now);
                noise.stop(now + 0.3);
            }

            playBookPickup() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(140, now);
                osc.frequency.exponentialRampToValueAtTime(35, now + 0.25);

                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.25);
            }
        }

        class SingleBookApp {
            constructor() {
                this.audio = new WebAudioFX();
                this.currentLeafIndex = 0;
                this.totalLeaves = 0;

                this.bookModal = document.getElementById('book-modal');
                this.viewport = document.getElementById('book-3d-viewport');
                this.badge = document.getElementById('active-book-badge');
                this.pageIndicator = document.getElementById('modal-page-indicator');
                this.btnPrev = document.getElementById('btn-prev-page');
                this.btnNext = document.getElementById('btn-next-page');

                this.initParticles();
                this.attachListeners();
            }

            initParticles() {
                const canvas = document.getElementById('particles-canvas');
                const ctx = canvas.getContext('2d');
                let width = canvas.width = window.innerWidth;
                let height = canvas.height = window.innerHeight;

                window.addEventListener('resize', () => {
                    width = canvas.width = window.innerWidth;
                    height = canvas.height = window.innerHeight;
                });

                const particles = Array.from({ length: 30 }, () => ({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 1.2 + 0.5,
                    alpha: Math.random() * 0.4 + 0.1,
                    speedY: -Math.random() * 0.2 - 0.05
                }));

                function render() {
                    ctx.clearRect(0, 0, width, height);
                    particles.forEach(p => {
                        p.y += p.speedY;
                        if (p.y < 0) p.y = height;

                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(212, 175, 55, ${p.alpha})`;
                        ctx.fill();
                    });
                    requestAnimationFrame(render);
                }
                render();
            }

            attachListeners() {
                document.getElementById('btn-sound-toggle').addEventListener('click', () => {
                    this.audio.enabled = !this.audio.enabled;
                    document.getElementById('sound-icon').className = this.audio.enabled 
                        ? "fa-solid fa-volume-high text-amber-400" 
                        : "fa-solid fa-volume-xmark text-rose-400";
                });

                window.addEventListener('keydown', (e) => {
                    if (this.bookModal.classList.contains('opacity-0')) return;
                    if (e.key === 'ArrowRight') this.nextPage();
                    if (e.key === 'ArrowLeft') this.prevPage();
                    if (e.key === 'Escape') this.closeBook();
                });
            }

            openBook() {
                this.currentLeafIndex = 0;
                this.audio.playBookPickup();
                this.badge.textContent = SINGLE_BOOK_DATA.title;

                this.renderBookPages(SINGLE_BOOK_DATA);

                this.bookModal.classList.remove('opacity-0', 'pointer-events-none');
                this.updateUI();
            }

            renderBookPages(book) {
                const dynamicLeaves = this.viewport.querySelectorAll('.book-page-3d');
                dynamicLeaves.forEach(el => el.remove());

                this.totalLeaves = book.leaves.length;

                book.leaves.forEach((leaf, idx) => {
                    const leafNum = idx + 1;
                    const pageEl = document.createElement('div');
                    pageEl.className = 'book-page-3d';
                    pageEl.id = `leaf-${leafNum}`;
                    pageEl.style.zIndex = `${50 - leafNum}`;

                    pageEl.innerHTML = `
                        <div class="page-face">
                            <img src="${leaf.front}" alt="Page ${(leafNum * 2) - 1}" class="page-img">
                            <div class="corner-fold" title="Flip Page"></div>
                        </div>
                        <div class="page-face page-face-back">
                            <img src="${leaf.back}" alt="Page ${leafNum * 2}" class="page-img">
                        </div>
                    `;

                    pageEl.addEventListener('click', (e) => {
                        if (e.target.closest('button')) return;
                        if (this.currentLeafIndex < leafNum) {
                            this.nextPage();
                        } else {
                            this.prevPage();
                        }
                    });

                    this.viewport.appendChild(pageEl);
                });
            }

            nextPage() {
                if (this.currentLeafIndex < this.totalLeaves) {
                    this.currentLeafIndex++;
                    const leafEl = document.getElementById(`leaf-${this.currentLeafIndex}`);
                    if (leafEl) {
                        leafEl.style.transform = "rotateY(-180deg)";
                        leafEl.style.zIndex = `${50 + this.currentLeafIndex}`;
                        this.audio.playPageFlip();
                    }
                    this.updateUI();
                }
            }

            prevPage() {
                if (this.currentLeafIndex > 0) {
                    const leafEl = document.getElementById(`leaf-${this.currentLeafIndex}`);
                    if (leafEl) {
                        leafEl.style.transform = "rotateY(0deg)";
                        leafEl.style.zIndex = `${50 - this.currentLeafIndex}`;
                        this.audio.playPageFlip();
                    }
                    this.currentLeafIndex--;
                    this.updateUI();
                }
            }

            closeBook() {
                this.audio.playBookPickup();
                
                for (let i = this.totalLeaves; i >= 1; i--) {
                    const leafEl = document.getElementById(`leaf-${i}`);
                    if (leafEl) {
                        leafEl.style.transform = "rotateY(0deg)";
                        leafEl.style.zIndex = `${50 - i}`;
                    }
                }
                this.currentLeafIndex = 0;

                setTimeout(() => {
                    this.bookModal.classList.add('opacity-0', 'pointer-events-none');
                }, 300);
            }

            updateUI() {
                const totalPages = this.totalLeaves * 2;
                let currentPage = 1;

                if (this.currentLeafIndex > 0) {
                    currentPage = this.currentLeafIndex * 2;
                }

                this.pageIndicator.textContent = `PAGE ${currentPage} / ${totalPages}`;

                this.btnPrev.disabled = this.currentLeafIndex === 0;
                this.btnNext.disabled = this.currentLeafIndex === this.totalLeaves;
            }
        }

        window.onload = () => {
            window.app = new SingleBookApp();
        };
    </script>
</body>
</html>
