    <style>
        :root {
            --bg-dark: #0a080d;
            --shelf-wood: #1e110a;
            --gold-glow: rgba(212, 175, 55, 0.3);
            --cyan-glow: rgba(0, 240, 255, 0.3);
            --crimson-glow: rgba(180, 20, 20, 0.3);
        }

        body {
            background-color: var(--bg-dark);
            background-image:
                radial-gradient(circle at 50% 20%, #2a2032 0%, #120d18 55%, #08050a 100%),
                radial-gradient(circle at 20% 80%, rgba(212, 175, 55, 0.08) 0%, transparent 55%),
                radial-gradient(circle at 80% 80%, rgba(0, 240, 255, 0.08) 0%, transparent 55%);
            color: #e2e8f0;
            font-family: 'Playfair Display', serif;
            overflow-x: hidden;
            user-select: none;
        }

        /* Ambient Lighting Particles Container */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
        }

        /* 3D Bookshelf Structure */
        .shelf-container {
            perspective: 1200px;
            perspective-origin: 50% 40%;
        }

        .shelf-wood {
            background: linear-gradient(180deg, #2a1810 0%, #180d08 60%, #0d0604 100%);
            box-shadow: 
                0 20px 40px rgba(0,0,0,0.9),
                inset 0 2px 4px rgba(255,255,255,0.1),
                inset 0 -10px 20px rgba(0,0,0,0.8);
            border-bottom: 6px solid #0a0402;
            transform-style: preserve-3d;
        }

        .shelf-backdrop {
            background: radial-gradient(ellipse at center, rgba(58, 39, 31, 0.82) 0%, rgba(18, 11, 12, 0.94) 100%);
            box-shadow: inset 0 0 55px rgba(0,0,0,0.72);
        }

        /* Shelf Book Wrapper 3D Dynamics */
        .book-shelf-item {
            transform-style: preserve-3d;
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            cursor: pointer;
        }

        .book-shelf-item:hover {
            transform: translateZ(35px) translateY(-15px) rotateY(-8deg);
        }

        /* --- BOOK 1: ANCIENT SPELLBOOK (GRIMOIRE) --- */
        .cover-grimoire {
            background: radial-gradient(circle, #62351f 0%, #2d1208 100%);
            border: 8px solid #140501;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.9), 0 10px 25px rgba(0,0,0,0.8);
            position: relative;
        }
        .cover-grimoire::before {
            content: '';
            position: absolute;
            inset: 6px;
            border: 2px dashed #8a6428;
            opacity: 0.6;
            pointer-events: none;
        }

        /* --- BOOK 2: SCI-FI CYBERNETIC CODEX --- */
        .cover-scifi {
            background: linear-gradient(135deg, #17344d 0%, #0a1728 100%);
            border: 2px solid #00f0ff;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3), inset 0 0 20px rgba(0, 240, 255, 0.2);
            position: relative;
            overflow: hidden;
        }
        .cover-scifi-circuit {
            position: absolute;
            inset: 0;
            background-image: 
                radial-gradient(#00f0ff 1px, transparent 0),
                linear-gradient(to right, rgba(0,240,255,0.08) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0,240,255,0.08) 1px, transparent 1px);
            background-size: 16px 16px, 16px 16px, 16px 16px;
            opacity: 0.5;
        }

        /* --- BOOK 3: ROYAL CHRONICLES --- */
        .cover-royal {
            background: linear-gradient(135deg, #681d2b 0%, #310b12 100%);
            border: 6px solid #d4af37;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 25px rgba(212,175,55,0.25);
            position: relative;
        }
        .gold-pattern {
            border: 1px solid rgba(212, 175, 55, 0.4);
            outline: 2px solid rgba(212, 175, 55, 0.2);
            outline-offset: -6px;
        }

        /* --- 3D BOOK MODAL & PAGE FLIP ENGINE --- */
        .modal-scene {
            perspective: 2200px;
            perspective-origin: 50% 45%;
        }

        .book-3d-viewport {
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
            position: relative;
            width: 760px;
            height: 520px;
        }

        @media (max-width: 820px) {
            .book-3d-viewport {
                width: 90vw;
                height: 60vh;
            }
        }

        .book-page-3d {
            position: absolute;
            right: 0;
            top: 0;
            width: 50%;
            height: 100%;
            transform-style: preserve-3d;
            transform-origin: left center;
            transition: transform 0.9s cubic-bezier(0.645, 0.045, 0.355, 1);
            border-radius: 4px 12px 12px 4px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
        }

        .page-face {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            padding: 24px;
            overflow-y: auto;
            border-radius: 4px 12px 12px 4px;
        }

        .page-face-back {
            transform: rotateY(180deg);
            border-radius: 12px 4px 4px 12px;
        }

        /* Book Themes Page Styling */
        /* Grimoire Paper */
        .paper-grimoire {
            background: linear-gradient(to right, #ead9ba 0%, #fff2d8 10%, #fff6df 90%, #e8d5b5 100%);
            color: #2a1508;
            font-family: 'MedievalSharp', cursive;
            border: 1px solid rgba(139, 90, 43, 0.3);
            box-shadow: inset 0 0 30px rgba(100, 70, 30, 0.2);
        }
        
        /* Sci-Fi HUD Screen Paper */
        .paper-scifi {
            background: linear-gradient(to right, #102b42 0%, #163b58 50%, #102b42 100%);
            color: #64ffda;
            font-family: 'Share Tech Mono', monospace;
            border: 1px solid rgba(0, 240, 255, 0.3);
            box-shadow: inset 0 0 25px rgba(0, 240, 255, 0.15);
        }

        /* Royal Ivory Parchment Paper */
        .paper-royal {
            background: linear-gradient(to right, #ead8b9 0%, #fff7e8 10%, #fffaf0 90%, #e8d3b1 100%);
            color: #1a0f0a;
            font-family: 'Playfair Display', serif;
            border: 1px solid rgba(212, 175, 55, 0.4);
            box-shadow: inset 0 0 20px rgba(180, 140, 60, 0.15);
        }

        /* Drop Cap Styling */
        .drop-cap-grimoire {
            float: left;
            font-family: 'UnifrakturMaguntia', cursive;
            font-size: 3.5rem;
            line-height: 0.8;
            padding: 2px 8px 0 0;
            color: #8b0000;
        }

        .drop-cap-royal {
            float: left;
            font-family: 'Cinzel', serif;
            font-size: 3.2rem;
            line-height: 0.8;
            padding: 2px 8px 0 0;
            color: #d4af37;
            font-weight: 800;
        }

        /* Custom Scrollbar for inner page text */
        .page-face::-webkit-scrollbar {
            width: 4px;
        }
        .page-face::-webkit-scrollbar-thumb {
            background: rgba(150, 110, 50, 0.4);
            border-radius: 4px;
        }

        /* Corner Fold Hint */
        .corner-fold {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 0 28px 28px;
            border-color: transparent transparent rgba(0,0,0,0.2) transparent;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .book-page-3d:hover .corner-fold {
            border-width: 0 0 40px 40px;
            border-color: transparent transparent #d4af37 transparent;
        }
    </style>
</head>

        // --- 2. WEB AUDIO API SYNTHESIZER ---
        class WebAudioFX {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
            }

            // Realistic Paper Page Flip Sound Effect
            playPageFlip() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;

                const bufferSize = this.ctx.sampleRate * 0.3;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(900, now);
                filter.frequency.exponentialRampToValueAtTime(300, now + 0.28);
                filter.Q.value = 2;

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.01, now);
                gain.gain.linearRampToValueAtTime(0.3, now + 0.08);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);

                noise.start(now);
                noise.stop(now + 0.3);
            }

            // Heavy Book Pickup / Slam Sound
            playBookPickup() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(140, now);
                osc.frequency.exponentialRampToValueAtTime(35, now + 0.25);

                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.25);
            }

            // Magical Chime Sound
            playMagicChime() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.frequency.setValueAtTime(f, now + i * 0.05);
                    gain.gain.setValueAtTime(0.1, now + i * 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.05 + 0.3);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + i * 0.05);
                    osc.stop(now + i * 0.05 + 0.3);
                });
            }

            // Sci-Fi Synth Sound
            playSciFiBeep() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);

                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.15);
            }
        }

        // --- 3. MAIN APPLICATION ENGINE ---
        class BookshelfApp {
            constructor() {
                this.audio = new WebAudioFX();
                this.currentBookIndex = 0;
                this.currentSpread = 0;
                this.totalSpreads = 0;

                // DOM Elements
                this.bookModal = document.getElementById('book-modal');
                this.viewport = document.getElementById('book-3d-viewport');
                this.badge = document.getElementById('active-book-badge');
                this.pageIndicator = document.getElementById('modal-page-indicator');
                this.btnPrev = document.getElementById('btn-prev-page');
                this.btnNext = document.getElementById('btn-next-page');

                this.initParticles();
                this.attachListeners();
            }

            initParticles() {
                const canvas = document.getElementById('particles-canvas');
                const ctx = canvas.getContext('2d');
                let width = canvas.width = window.innerWidth;
                let height = canvas.height = window.innerHeight;

                window.addEventListener('resize', () => {
                    width = canvas.width = window.innerWidth;
                    height = canvas.height = window.innerHeight;
                });

                const particles = Array.from({ length: 40 }, () => ({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 1.5 + 0.5,
                    alpha: Math.random() * 0.5 + 0.2,
                    speedY: -Math.random() * 0.3 - 0.1
                }));

                function render() {
                    ctx.clearRect(0, 0, width, height);
                    particles.forEach(p => {
                        p.y += p.speedY;
                        if (p.y < 0) p.y = height;

                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(212, 175, 55, ${p.alpha})`;
                        ctx.fill();
                    });
                    requestAnimationFrame(render);
                }
                render();
            }

            attachListeners() {
                // Sound Toggle
                document.getElementById('btn-sound-toggle').addEventListener('click', () => {
                    this.audio.enabled = !this.audio.enabled;
                    document.getElementById('sound-icon').className = this.audio.enabled 
                        ? "fa-solid fa-volume-high text-amber-400" 
                        : "fa-solid fa-volume-xmark text-rose-400";
                });

                // Keyboard controls
                window.addEventListener('keydown', (e) => {
                    if (this.bookModal.classList.contains('opacity-0')) return;
                    if (e.key === 'ArrowRight') this.nextPage();
                    if (e.key === 'ArrowLeft') this.prevPage();
                    if (e.key === 'Escape') this.closeBook();
                });
            }

            openBook(index) {
                this.currentBookIndex = index;
                this.currentSpread = 0;
                const book = BOOKS_DATA[index];

                this.audio.playBookPickup();
                this.badge.textContent = book.title;

                // Render pages for this book
                this.renderBookPages(book);

                // Show modal
                this.bookModal.classList.remove('opacity-0', 'pointer-events-none');
                
                this.updateUI();
            }

            renderBookPages(book) {
                this.viewport.innerHTML = '';
                this.totalSpreads = book.pages.length;

                book.pages.forEach((spread, idx) => {
                    const spreadNum = idx + 1;
                    const pageEl = document.createElement('div');
                    pageEl.className = `book-page-3d ${book.themeClass}`;
                    pageEl.id = `page-spread-${spreadNum}`;
                    pageEl.style.zIndex = `${10 - spreadNum}`;

                    pageEl.innerHTML = `
                        <!-- Front Face (Right Page) -->
                        <div class="page-face flex flex-col justify-between">
                            <div class="border-b border-current/20 pb-1 text-[10px] uppercase font-mono tracking-widest flex justify-between">
                                <span>${spread.right.header}</span>
                                <span>P. ${spreadNum * 2}</span>
                            </div>
                            <div class="my-auto">
                                ${spread.right.content}
                            </div>
                            <div class="corner-fold" title="Flip Page"></div>
                        </div>

                        <!-- Back Face (Left Page) -->
                        <div class="page-face page-face-back flex flex-col justify-between">
                            <div class="border-b border-current/20 pb-1 text-[10px] uppercase font-mono tracking-widest flex justify-between">
                                <span>P. ${(spreadNum * 2) - 1}</span>
                                <span>${spread.left.header}</span>
                            </div>
                            <div class="my-auto">
                                ${spread.left.content}
                            </div>
                        </div>
                    `;

                    pageEl.addEventListener('click', (e) => {
                        if (e.target.closest('button')) return;
                        if (this.currentSpread < spreadNum) {
                            this.nextPage();
                        } else {
                            this.prevPage();
                        }
                    });

                    this.viewport.appendChild(pageEl);
                });
            }

            nextPage() {
                if (this.currentSpread < this.totalSpreads) {
                    this.currentSpread++;
                    const pageEl = document.getElementById(`page-spread-${this.currentSpread}`);
                    if (pageEl) {
                        pageEl.style.transform = "rotateY(-180deg)";
                        this.audio.playPageFlip();
                    }
                    this.updateUI();
                }
            }

            prevPage() {
                if (this.currentSpread > 0) {
                    const pageEl = document.getElementById(`page-spread-${this.currentSpread}`);
                    if (pageEl) {
                        pageEl.style.transform = "rotateY(0deg)";
                        this.audio.playPageFlip();
                    }
                    this.currentSpread--;
                    this.updateUI();
                }
            }

            closeBook() {
                this.audio.playBookPickup();
                
                // Unflip pages
                for (let i = this.totalSpreads; i >= 1; i--) {
                    const el = document.getElementById(`page-spread-${i}`);
                    if (el) el.style.transform = "rotateY(0deg)";
                }

                setTimeout(() => {
                    this.bookModal.classList.add('opacity-0', 'pointer-events-none');
                }, 300);
            }

            updateUI() {
                const totalPages = this.totalSpreads * 2;
                const currentPage = this.currentSpread * 2;
                this.pageIndicator.textContent = `PAGE ${currentPage} / ${totalPages}`;

                this.btnPrev.disabled = this.currentSpread === 0;
                this.btnNext.disabled = this.currentSpread === this.totalSpreads;
            }

            playMagicSound() {
                this.audio.playMagicChime();
            }

            playSciFiSound() {
                this.audio.playSciFiBeep();
            }

            playFanfareSound() {
                this.audio.playMagicChime();
            }
        }

        // Launch App on Window Load
        window.onload = () => {
            window.app = new BookshelfApp();
        };
    </script>
